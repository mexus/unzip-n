[package]
name = "unzip-n"
version = "0.1.3"
authors = ["mexus"]
edition = "2024"
rust-version = "1.85"
description = "Procedural macro to generate `unzip` for iterators over n-sized tuples"
keywords = ["iterator", "unzip"]
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/unzip-n/"
repository = "https://github.com/mexus/unzip-n"
homepage = "https://github.com/mexus/unzip-n"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = {version = "2", features = ["full"]}

[lib]
proc-macro = true
